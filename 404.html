<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Halaman tidak ditemukan</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12110f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --ink: #171411;
      --muted: #665e52;
      --line: #d6cfbf;
      --accent: #a33d1f;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #12110f;
        --ink: #ece6da;
        --muted: #999184;
        --line: #322e27;
        --accent: #e0a458;
      }
    }

    * { box-sizing: border-box; }

    html {
      overflow-x: hidden;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      max-width: 100vw;
    }

    main {
      width: 100%;
      max-width: 640px;
    }

    .eyebrow {
      margin: 0 0 1rem;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .code {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(7rem, 32vw, 13rem);
      font-weight: 400;
      line-height: 0.8;
      letter-spacing: -0.06em;
    }

    .code span {
      color: var(--accent);
      font-size: 0.3em;
      vertical-align: super;
    }

    h1 {
      margin: 1.5rem 0 0.5rem;
      font-family: var(--serif);
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 400;
      line-height: 1.2;
    }

    .en {
      margin: 0 0 2rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.1rem;
      border: 1.5px solid var(--ink);
      background: var(--ink);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .back:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--accent);
    }

    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .back { transition: none; }
      .back:hover { transform: none; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Error · 404</p>
    <p class="code">404<span>*</span></p>
    <h1>Halaman ini tidak ada.</h1>
    <p class="en" lang="en">This page does not exist. The link may be wrong, or the page has moved.</p>
    <a class="back" href="index.html">← Kembali ke portofolio</a>
    <footer>Dzakk · 2026</footer>
  </main>
</body>
</html>
